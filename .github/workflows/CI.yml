name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest]
    env:
      JULIA_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          path: LULU.jl
      - name: Checkout NucleotideSearch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/NucleotideSearch.jl
          path: NucleotideSearch.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test with unregistered dependency
        run: julia --project=LULU.jl -e 'using Pkg; Pkg.develop(path=ARGS[1]); Pkg.test()' NucleotideSearch.jl
